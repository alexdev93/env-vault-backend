name: CI

# Lint the CLI and smoke-test the Worker (real `wrangler dev`, throwaway secrets,
# temporary database). This repo never deploys: production is deployed only from
# the env-vault root repo, which combines this backend with the web dashboard.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Lint CLI scripts
        run: shellcheck cli/*.sh
      - run: npm ci
      - run: npm test

  # The CLI runs on servers, CI runners and laptops we don't control: run it in
  # macOS's bash 3.2, a python3-only Alpine, and a node-only Node image.
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: CLI on bash 3.2 / python-only / node-only
        run: bash test/platforms.sh
